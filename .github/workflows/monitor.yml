name: DessMonitor Check

on:
  schedule:
    - cron: '*/1 * * * *' # Запуск каждую минуту
  workflow_dispatch: # Позволяет запускать проверку вручную кнопкой в интерфейсе

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Обязательно для сохранения файла состояния в репозиторий
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitoring script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
          DESS_REQUEST_URL: ${{ secrets.DESS_REQUEST_URL }}
          DESS_USER: ${{ secrets.DESS_USER }}
          DESS_PASSWORD: ${{ secrets.DESS_PASSWORD }}
          DESS_COMPANY_KEY: ${{ secrets.DESS_COMPANY_KEY }}
        run: python DessMonitoring.py

      - name: Commit and push state changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dessmonitor_state.json
          git status
          git commit -m "chore: update monitor state [skip ci]" || echo "No changes to commit"
          git push

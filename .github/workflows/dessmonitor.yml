name: DessMonitor

on:
  workflow_dispatch:

concurrency:
  group: dessmonitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: dessmonitor_state.json
          key: dessmonitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dessmonitor-state-

      - name: Run DessMonitoring
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
          DESS_REQUEST_URL: ${{ secrets.DESS_REQUEST_URL }}
          DESS_USER: ${{ secrets.DESS_USER }}
          DESS_PASSWORD: ${{ secrets.DESS_PASSWORD }}
          DESS_COMPANY_KEY: ${{ secrets.DESS_COMPANY_KEY }}
          DESS_QUIET_WEEKDAYS: ${{ secrets.DESS_QUIET_WEEKDAYS }}
          DESS_QUIET_WEEKENDS: ${{ secrets.DESS_QUIET_WEEKENDS }}
          DESS_CYCLES: '10'
          DESS_INTERVAL: '30'
          DESS_TZ: 'Europe/Kyiv'
        run: python DessMonitoring.py

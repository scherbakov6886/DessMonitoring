name: DessMonitor

on:
  schedule:
    - cron: '*/5 * * * *'   # минимальный интервал, который поддерживает GitHub
  workflow_dispatch:         # ручной запуск для проверки

# Не запускать два job одновременно (запуск длится ~4 мин, GitHub может задержать следующий)
concurrency:
  group: dessmonitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6      # скрипт работает ~4 минуты (5 проверок по 60 сек)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # Восстанавливаем state с прошлого запуска.
      # Кэш в GitHub неизменяемый, поэтому ключ уникален для каждого запуска,
      # а restore-keys подтягивает самый свежий сохранённый кэш.
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: dessmonitor_state.json
          key: dessmonitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dessmonitor-state-

      - name: Run DessMonitoring
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
          DESS_REQUEST_URL: ${{ secrets.DESS_REQUEST_URL }}
          DESS_USER: ${{ secrets.DESS_USER }}
          DESS_PASSWORD: ${{ secrets.DESS_PASSWORD }}
          DESS_COMPANY_KEY: ${{ secrets.DESS_COMPANY_KEY }}
          DESS_CYCLES: '5'      # количество проверок за запуск
          DESS_INTERVAL: '60'   # интервал между проверками, сек
        run: python DessMonitoring.py
